name: Sync RTT CN Website

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # RTT is published as a static distribution repository. Keep this mirror
      # workflow independent from the private Astro source tree.
      - name: Checkout RTT distribution
        uses: actions/checkout@v4
        with:
          repository: Jensen-Yao/RTT
          ref: main
          path: source

      - name: Stage static website
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          rsync -a --delete --exclude='.git' --exclude='.github' source/ dist/
          test -f dist/index.html
          test -f dist/CNAME
          test -f dist/sitemap.xml

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
